plugins { id 'com.android.application' }
def engine = rootProject.file('.engine/main')
android {
    namespace 'de.blinkt.openvpn'
    compileSdk 36
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId 'org.aerovpn.android'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
        buildConfigField 'String', 'FLAVOR', '"skeleton"'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++23'; arguments '-DCMAKE_JOB_POOLS=compile=4;link=2', '-DCMAKE_JOB_POOL_COMPILE=compile', '-DCMAKE_JOB_POOL_LINK=link' } }
    }
    buildFeatures { aidl true; buildConfig true }
    buildTypes { debug { buildConfigField 'boolean', 'openvpn3', 'false' }; release { buildConfigField 'boolean', 'openvpn3', 'false'; minifyEnabled false } }
    sourceSets {
        main {
            java.srcDirs += [new File(engine, 'src/main/java'), new File(engine, 'src/skeleton/java')]
            aidl.srcDirs += [new File(engine, 'src/main/aidl')]
            res.srcDirs += [new File(engine, 'src/main/res'), new File(engine, 'src/skeleton/res')]
            assets.srcDirs += [new File(engine, 'src/main/assets'), new File(engine, 'build/ovpnassets')]
        }
    }
    externalNativeBuild { cmake { path new File(engine, 'src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true } }
    lint { disable 'MissingTranslation'; abortOnError true }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
}

// Pre-Android 10 uses the ABI-specific executable asset; include it on a clean build.
tasks.configureEach { task ->
    if (task.name == "mergeDebugAssets") task.dependsOn "externalNativeBuildDebug"
    if (task.name == "mergeReleaseAssets") task.dependsOn "externalNativeBuildRelease"
}
