name: Refresh public VPN Gate directory
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: node-directory-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/update_nodes.py
      - name: Save refreshed public list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nodes/vpngate.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public VPN Gate directory'
            git push origin HEAD:main
          fi
